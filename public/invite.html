<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Lời mời người thân | HEROS</title>
    <link rel="stylesheet" href="/invite-assets/invite.css" />
    <script src="/invite-assets/invite.js" defer></script>
  </head>
  <body>
    <main>
      <h1>HEROS</h1>
      <h2>Kết nối với người thân</h2>
      <p>
        Cài HEROS, đăng ký bằng email được mời và nhập mã để xác nhận kết nối.
      </p>
      <label for="code">Mã lời mời</label>
      <input id="code" readonly aria-label="Mã lời mời" />
      <button id="copy" type="button" disabled>Sao chép mã</button>
      <a id="open" hidden>Mở HEROS</a>
      <a id="ios" hidden>Cài HEROS trên iPhone</a>
      <a id="android" hidden>Cài HEROS trên Android</a>
      <p id="status" role="status">Đang tải thông tin cài đặt…</p>
      <p>
        Chỉ chấp nhận lời mời từ người bạn biết. Không chia sẻ mã này công khai.
      </p>
    </main>
  </body>
</html>
